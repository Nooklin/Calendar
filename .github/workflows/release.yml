name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag against version.properties
        run: |
          name=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d '\r')
          if [ "v$name" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $name in version.properties"
            exit 1
          fi
          test -f "RELEASE_NOTES_${GITHUB_REF_NAME}.md" || { echo "RELEASE_NOTES_${GITHUB_REF_NAME}.md is missing"; exit 1; }

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "A signing secret is missing in Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Name the APK and hash it
        run: |
          cp app/build/outputs/apk/release/app-release.apk "calendar-${GITHUB_REF_NAME}.apk"
          sha256sum "calendar-${GITHUB_REF_NAME}.apk" | tee SHA256.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES_${{ github.ref_name }}.md
          files: |
            calendar-${{ github.ref_name }}.apk
            SHA256.txt
